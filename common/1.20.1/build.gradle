plugins {
    id 'fabric-loom'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../shared/src/main/java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "com.electronwill.night-config:core:3.8.3"
    compileOnly "com.electronwill.night-config:toml:3.8.3"
}

// NBT Structure Multi-Version Conversion (1.21.1 -> 1.20.1).
//
// The 1.21.1 structure files (singular 'structure' dir) are converted into 1.20.1
// format and emitted under the 1.20.1 'structures' (plural) data path. Item data
// carried by containers/entities (e.g. item frames, merchant equipment) uses the
// 1.21.1 component format and is rewritten to the 1.20.1 legacy tag format by the
// shared Querz-NBT-based converter (compiled via buildSrc). Pure Groovy/Java — no
// Python required.
def nbtInputDir = rootProject.file('common/1.21.1/src/main/resources/data/minersmarket/structure')
def nbtOutputDir = file('build/generated/nbt/data/minersmarket/structures')

tasks.register('convertNbt') {
    group = 'build'
    description = 'Convert NBT structure files from 1.21.1 to 1.20.1 format'

    inputs.dir(nbtInputDir).optional()
    outputs.dir(nbtOutputDir)

    doLast {
        if (!nbtInputDir.exists()) {
            logger.lifecycle("NBT conversion: input directory does not exist, skipping: ${nbtInputDir}")
            return
        }
        def nbtFiles = fileTree(dir: nbtInputDir, includes: ['**/*.nbt']).files
        if (nbtFiles.isEmpty()) {
            logger.lifecycle("NBT conversion: no .nbt files found in ${nbtInputDir}")
            return
        }
        def converter = new com.github.ksoichiro.mcmod.V1_21ToV1_20NbtConverter()
        def targetDataVersion = 3465 // MC 1.20.1
        nbtOutputDir.mkdirs()
        nbtFiles.each { File f ->
            def rel = nbtInputDir.toPath().relativize(f.toPath()).toString()
            def out = new File(nbtOutputDir, rel)
            out.parentFile.mkdirs()
            out.bytes = converter.convert(f.bytes, targetDataVersion)
        }
        logger.lifecycle("NBT conversion: converted ${nbtFiles.size()} structure file(s) from 1.21.1 to 1.20.1")
    }
}

processResources.dependsOn convertNbt

// Expose sources and resources to the platform modules.
// The generated-NBT resource dir is built by convertNbt, so consumers
// (fabric/forge) trigger the conversion when they resolve commonResources.
configurations {
    commonJava {
        canBeConsumed = true
        canBeResolved = false
    }
    commonResources {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    sourceSets.main.java.srcDirs.each { dir -> commonJava dir }
    sourceSets.main.resources.srcDirs.each { dir -> commonResources dir }
    commonResources(file('build/generated/nbt')) { builtBy 'convertNbt' }
}

// Expand pack_format variable in pack.mcmeta
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'pack_format', project.ext.pack_format

    filesMatching('pack.mcmeta') {
        expand 'pack_format': project.ext.pack_format
    }
}

// Common module only provides sources to platform modules — no jar remapping needed.
tasks.named('remapJar') {
    enabled = false
}

tasks.named('sourcesJar') {
    dependsOn convertNbt
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
