plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neoform_version
}

dependencies {
    // Common client-only classes use Fabric @Environment; provide it at compile time only.
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "com.electronwill.night-config:core:3.8.3"
    compileOnly "com.electronwill.night-config:toml:3.8.3"
}

configurations {
    commonJava {
        canBeConsumed = true
        canBeResolved = false
    }
    commonResources {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    sourceSets.main.java.srcDirs.each { dir -> commonJava dir }
    sourceSets.main.resources.srcDirs.each { dir -> commonResources dir }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'pack_format', project.ext.pack_format

    filesMatching('pack.mcmeta') {
        expand 'pack_format': project.ext.pack_format
    }
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
